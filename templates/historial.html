<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/js/service-worker.js')
      .then(() => console.log('Service Worker registrado con éxito'));
  }
</script>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Citas - Studio 02</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="mb-4">Historial de Citas</h2>
    
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Cliente</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Notas</th>
                    </tr>
                </thead>
                <tbody>
                    {% for cita in citas %}
                    <tr>
                        <td>{{ cita.cliente.nombre }}</td>
                        <td>{{ cita.fecha.strftime('%d/%m/%Y %H:%M') }}</td>
                        <td>
                            <span class="badge {{ 'bg-success' if cita.estado.value == 'completada' else 'bg-warning' }}">
                                {{ cita.estado.value }}
                            </span>
                        </td>
                        <td>{{ cita.notas }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center">No hay citas registradas.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <a href="/" class="btn btn-primary mt-3">Volver al Calendario</a>
</div>

</body>
</html>
